name: Summarize new videos

on:
  # Schedule paused: YouTube blocks GitHub's IPs for captions (see README). To re-enable,
  # uncomment the three lines below (and set TRANSCRIPT_PROXY_URL).
  # schedule:
  #   # Every 3 hours (UTC) at minute 17. Anthropic cost only applies with a new video.
  #   - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: "Summarize the newest video now and send it to your outputs (ignores saved state)"
        type: boolean
        default: false

# Needed to commit state/seen_videos.json back to the repository
permissions:
  contents: write

concurrency:
  group: yt-summarizer
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Run
        env:
          YT_CHANNEL: ${{ secrets.YT_CHANNEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          OUTPUTS: ${{ secrets.OUTPUTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          USER_CONTEXT: ${{ secrets.USER_CONTEXT }}
          TRANSCRIPT_PROXY_URL: ${{ secrets.TRANSCRIPT_PROXY_URL }}
        run: python -m youtube_summarizer ${{ github.event.inputs.test_latest == 'true' && '--test-latest' || '' }}

      - name: Commit updated state
        run: |
          git config user.name  "yt-summarizer-bot"
          git config user.email "yt-summarizer-bot@users.noreply.github.com"
          git add state/seen_videos.json
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "chore: update state"
          git push
