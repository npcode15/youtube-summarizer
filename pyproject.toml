[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-summarizer"
version = "0.1.0"
description = "Watch a YouTube channel and post a tiered (Important / Medium / Low) AI summary of each new video to Discord."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "youtube-transcript-api>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
local = ["python-dotenv>=1.0"]

[project.scripts]
youtube-summarizer = "youtube_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
